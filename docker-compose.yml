# Background data refresh for the Venn fire viewer.
#
#   docker compose up -d refresh      start
#   docker compose logs -f refresh    watch
#   docker compose down               stop
#
# FIRMS_MAP_KEY is read from .env, which is gitignored. Without it the FIRMS
# source reports itself as skipped rather than failing the whole daemon.

services:
  refresh:
    build: .
    container_name: venn-fire-refresh
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Read-only: the daemon runs these, it never edits them.
      - ./scripts:/app/scripts:ro
      # Writable: bundled snapshots are rewritten in place, then verified.
      - ./src:/app/src
      # Writable: raw provider responses and the audit trail.
      - ./.local-data:/app/.local-data
    # Per-source intervals are defined in the daemon and matched to how fast each
    # provider actually publishes. The tick only controls how often due sources
    # are checked, so a short tick costs nothing.
    command: ["--tickSeconds", "60"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
