name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Verify production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify leased refresh pipeline and durable flight history
        run: pnpm verify:refresh && pnpm verify:flight-history

      - name: Verify FIRMS sensor capabilities and parsing
        run: pnpm verify:firms-sensors

      - name: Verify live area-report parsers
        run: pnpm verify:live-reports

      - name: Build production site
        run: pnpm build
