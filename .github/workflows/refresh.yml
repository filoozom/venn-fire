name: Refresh production data

on:
  push:
    branches:
      - main
  schedule:
    # Durable Vercel Queue delivery is primary; this is a staggered fallback.
    - cron: '3/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-data-refresh
  # A newer release supersedes an older push that is still waiting for its SHA.
  # Scheduled fallbacks never cancel a release run; they queue behind it.
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Activate the deployed revision and run leased refresh
        env:
          DEPLOYMENT_URL: https://venn-fire.vercel.app/api/deployment
          REFRESH_URL: https://venn-fire.vercel.app/api/refresh
        run: |
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          deployment_ready=false
          for attempt in $(seq 1 24); do
            http_code="$(curl --retry 2 --retry-all-errors --max-time 90 --silent --show-error \
              --output "$response_file" --write-out '%{http_code}' "$DEPLOYMENT_URL")"
            deployment_id="$(jq --raw-output '.deployment.deploymentId // empty' "$response_file" 2>/dev/null || true)"
            deployed_sha="$(jq --raw-output '.deployment.gitCommitSha // empty' "$response_file" 2>/dev/null || true)"

            sha_ready=true
            expected_sha=active-production
            if test "$GITHUB_EVENT_NAME" = "push"; then
              expected_sha="$GITHUB_SHA"
              if test -z "$deployed_sha" || test "$deployed_sha" != "$GITHUB_SHA"; then
                sha_ready=false
              fi
            fi

            echo "attempt=$attempt event=$GITHUB_EVENT_NAME probe_http=$http_code deployment_id=${deployment_id:-none} deployed_sha=${deployed_sha:-none} expected_sha=$expected_sha"
            if test "$http_code" -ge 200 \
              && test "$http_code" -lt 300 \
              && test -n "$deployment_id" \
              && test "$sha_ready" = true; then
              deployment_ready=true
              break
            fi
            sleep 10
          done

          if test "$deployment_ready" != true; then
            cat "$response_file"
            exit 1
          fi

          http_code="$(curl --max-time 90 --silent --show-error \
            --output "$response_file" --write-out '%{http_code}' "$REFRESH_URL")"
          refresh_ok="$(jq --raw-output '.ok // false' "$response_file" 2>/dev/null || true)"
          echo "refresh_http=$http_code refresh_ok=$refresh_ok deployment_id=$deployment_id deployed_sha=${deployed_sha:-none}"
          if test "$http_code" -ge 200 \
            && test "$http_code" -lt 300 \
            && test "$refresh_ok" = true; then
            cat "$response_file"
            exit 0
          fi
          cat "$response_file"
          exit 1
