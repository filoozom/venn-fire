name: Refresh production data

on:
  push:
    branches:
      - main
  schedule:
    # Durable Vercel Queue delivery is primary; this is a staggered fallback.
    - cron: '3/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Activate the deployed revision and run leased refresh
        env:
          REFRESH_URL: https://venn-fire.vercel.app/api/refresh
        run: |
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          for attempt in $(seq 1 24); do
            http_code="$(curl --retry 2 --retry-all-errors --max-time 90 --silent --show-error \
              --output "$response_file" --write-out '%{http_code}' "$REFRESH_URL")"
            deployed_sha="$(jq --raw-output '.deployment.gitCommitSha // empty' "$response_file" 2>/dev/null || true)"
            refresh_ok="$(jq --raw-output '.ok // false' "$response_file" 2>/dev/null || true)"
            echo "attempt=$attempt http=$http_code deployed_sha=${deployed_sha:-none} refresh_ok=$refresh_ok"
            if test "$http_code" -ge 200 \
              && test "$http_code" -lt 300 \
              && test "$refresh_ok" = true \
              && test "$deployed_sha" = "$GITHUB_SHA"; then
              cat "$response_file"
              exit 0
            fi
            sleep 10
          done
          cat "$response_file"
          exit 1
