name: Refresh production data

on:
  push:
    branches:
      - main
  schedule:
    # Durable Vercel Queue delivery is primary; this is a staggered fallback.
    - cron: '3/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Activate the deployed revision and run leased refresh
        env:
          REFRESH_URL: https://venn-fire.vercel.app/api/refresh
        run: |
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          for attempt in $(seq 1 24); do
            http_code="$(curl --retry 2 --retry-all-errors --max-time 90 --silent --show-error \
              --output "$response_file" --write-out '%{http_code}' "$REFRESH_URL")"
            deployment_id="$(jq --raw-output '.deployment.deploymentId // empty' "$response_file" 2>/dev/null || true)"
            deployed_sha="$(jq --raw-output '.deployment.gitCommitSha // empty' "$response_file" 2>/dev/null || true)"
            refresh_ok="$(jq --raw-output '.ok // false' "$response_file" 2>/dev/null || true)"

            # A push must activate the deployment built from that exact commit.
            # Scheduled and manually dispatched runs are fallbacks for whatever
            # revision currently owns the production alias, so comparing their
            # checkout SHA with the deployed SHA is both unnecessary and wrong.
            sha_ready=true
            expected_sha=active-production
            if test "$GITHUB_EVENT_NAME" = "push"; then
              expected_sha="$GITHUB_SHA"
              if test -z "$deployed_sha" || test "$deployed_sha" != "$GITHUB_SHA"; then
                sha_ready=false
              fi
            fi

            echo "attempt=$attempt event=$GITHUB_EVENT_NAME http=$http_code deployment_id=${deployment_id:-none} deployed_sha=${deployed_sha:-none} expected_sha=$expected_sha refresh_ok=$refresh_ok"
            if test "$http_code" -ge 200 \
              && test "$http_code" -lt 300 \
              && test "$refresh_ok" = true \
              && test -n "$deployment_id" \
              && test "$sha_ready" = true; then
              cat "$response_file"
              exit 0
            fi
            sleep 10
          done
          cat "$response_file"
          exit 1
